name: SRCM Tailscale Private SSH Auth Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: srcm-tailscale-private-ssh-auth-smoke
  cancel-in-progress: false

jobs:
  tailscale-private-ssh-auth-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Connect ephemeral Tailscale node via WIF
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:straleon-ci-deploy

      - name: Resolve and verify stable production node identity
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.SRCM_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "straleon-prod-01"

          own_ip="$(tailscale ip --4)"
          case "$own_ip" in
            100.*) ;;
            *) exit 1 ;;
          esac

          command -v jq >/dev/null
          mapfile -t resolved_ips < <(tailscale ip --4 "$DEPLOY_HOST")
          test "${#resolved_ips[@]}" -eq 1
          resolved_deploy_ip="${resolved_ips[0]}"
          [[ "$resolved_deploy_ip" =~ ^100\. ]]

          whois_json="$(tailscale whois --json "$resolved_deploy_ip")"
          whois_machine_name="$(printf '%s\n' "$whois_json" | jq -r '.Node.Name // empty')"
          test -n "$whois_machine_name"
          whois_machine_name="${whois_machine_name%.}"
          whois_machine_label="${whois_machine_name%%.*}"
          test "$whois_machine_label" = "$DEPLOY_HOST"
          printf '%s\n' "$whois_json" | jq -e --arg tag 'tag:straleon-prod' '(.Node.Tags // []) | index($tag) != null' >/dev/null
          printf '%s\n' "$whois_json" | jq -e --arg ip "$resolved_deploy_ip" '(.Node.Addresses // []) | map(split("/")[0]) | index($ip) != null' >/dev/null

          route_line="$(ip route get "$resolved_deploy_ip")"
          case "$route_line" in
            *"dev tailscale0"*) ;;
            *) exit 1 ;;
          esac

          echo "RESOLVED_DEPLOY_IP=$resolved_deploy_ip" >> "$GITHUB_ENV"
          printf 'TARGET_LOGICAL_IDENTITY=GREEN_STRALEON_PROD_01\n'
          printf 'TARGET_TAILSCALE_TAG=GREEN_STRALEON_PROD\n'
          printf 'TARGET_IP_RESOLUTION=GREEN_DYNAMIC_RUNTIME\n'

      - name: Configure pinned OpenSSH deploy identity
        shell: bash
        env:
          RESOLVED_DEPLOY_IP: ${{ env.RESOLVED_DEPLOY_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SRCM_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SRCM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          test -n "$RESOLVED_DEPLOY_IP"
          known_key_material="$(printf '%s\n' "$KNOWN_HOSTS" | awk 'NF >= 3 && $1 !~ /^#/ {print $2 " " $3; exit}')"
          test -n "$known_key_material"
          printf '%s %s\n' "$RESOLVED_DEPLOY_IP" "$known_key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          private_fingerprint="$(ssh-keygen -yf "$HOME/.ssh/id_ed25519" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          test "$private_fingerprint" = 'SHA256:x6L1N7kD+rcrlqD7EB+boZgwDQc4AtO6NMMltEHZhpw'

          known_line="$(ssh-keygen -F "$RESOLVED_DEPLOY_IP" -f "$HOME/.ssh/known_hosts" | grep -v '^#' | head -n 1)"
          test -n "$known_line"
          known_fingerprint="$(printf '%s\n' "$known_line" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          test "$known_fingerprint" = 'SHA256:iy4hCZtEYlqi3MjSxLFmX7cKPTFXXfecZultd7c2Xj4'

          printf 'DEPLOY_PRIVATE_KEY_IDENTITY=GREEN_EXPECTED_ED25519_FINGERPRINT\n'
          printf 'TARGET_KNOWN_HOSTS=GREEN_EXACT_OOB_ED25519_FINGERPRINT\n'

      - name: Authenticate stable production identity read-only
        shell: bash
        env:
          RESOLVED_DEPLOY_IP: ${{ env.RESOLVED_DEPLOY_IP }}
        run: |
          set -euo pipefail
          target_name='straleon-prod-01'
          target_ip="$RESOLVED_DEPLOY_IP"
          user='straleon-deploy'
          test -n "$target_ip"

          route_line="$(ip route get "$target_ip")"
          case "$route_line" in
            *"dev tailscale0"*) ;;
            *) exit 1 ;;
          esac

          remote_output="$(ssh \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$user@$target_ip" \
            'set -eu
             root=/srv/srcm
             releases="$root/releases"
             current="$root/current"
             shared="$root/shared"
             db="$shared/database/database.sqlite"
             test "$(id -un)" = "straleon-deploy"
             test "$(hostname)" = "straleon-prod-01"
             test -d "$root"
             test -d "$releases"
             test -d "$shared"
             test -f "$shared/.env"
             test -d "$shared/storage"
             test -f "$db"
             test ! -e "$current"
             test ! -L "$current"
             test -z "$(find "$releases" -mindepth 1 -maxdepth 1 -print -quit)"
             db_sha="$(sha256sum "$db" | cut -d " " -f 1)"
             db_size="$(stat -c %s "$db")"
             test "$db_sha" = "b07434ffcaaea6c1be8373b2187e725dceb70be40bfbdc3571af5df5ba85595e"
             test "$db_size" = "3694592"
             printf "REMOTE_DEPLOY_IDENTITY=GREEN_STRICT_READ_ONLY_AUTH\\n"
             printf "REMOTE_HOSTNAME=GREEN_STRALEON_PROD_01\\n"
             printf "REMOTE_PREPARED_INFRASTRUCTURE=GREEN_ROOT_SHARED_RELEASES\\n"
             printf "REMOTE_RELEASES=GREEN_EMPTY\\n"
             printf "REMOTE_CURRENT=GREEN_ABSENT\\n"
             printf "REMOTE_DATABASE_SHA256=GREEN_EXACT_INITIAL_SNAPSHOT\\n"
             printf "REMOTE_DATABASE_SIZE=GREEN_EXACT_INITIAL_SNAPSHOT\\n"
             printf "REMOTE_MUTATION=NO\\n"')"

          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_DEPLOY_IDENTITY=GREEN_STRICT_READ_ONLY_AUTH'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_HOSTNAME=GREEN_STRALEON_PROD_01'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_PREPARED_INFRASTRUCTURE=GREEN_ROOT_SHARED_RELEASES'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_RELEASES=GREEN_EMPTY'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_CURRENT=GREEN_ABSENT'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_DATABASE_SHA256=GREEN_EXACT_INITIAL_SNAPSHOT'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_DATABASE_SIZE=GREEN_EXACT_INITIAL_SNAPSHOT'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_MUTATION=NO'

          printf 'TAILSCALE_PRIVATE_PATH=GREEN_TAILSCALE0\n'
          printf 'TARGET_LOGICAL_IDENTITY_FINAL=GREEN_STRALEON_PROD_01\n'
          printf 'TARGET_IP_POLICY=GREEN_RUNTIME_RESOLVED_NOT_PINNED\n'
          printf 'PRIVATE_SSH_AUTH=GREEN_STRICT_HOSTKEY_PUBLICKEY_ONLY\n'
          printf 'DEPLOY_USER=GREEN_STRALEON_DEPLOY\n'
          printf 'TARGET_PUBLIC_IPV4_USED=NO\n'
          printf 'REMOTE_MUTATION_INTENDED=NO\n'
          printf 'APPLICATION_DEPLOYMENT=NO\n'

      - name: Remove SSH material from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
