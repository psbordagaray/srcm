name: SRCM Tailscale Private SSH Auth Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: srcm-tailscale-private-ssh-auth-smoke
  cancel-in-progress: false

jobs:
  tailscale-private-ssh-auth-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Connect ephemeral Tailscale node via WIF
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:straleon-ci-deploy

      - name: Configure pinned OpenSSH deploy identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SRCM_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SRCM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          private_fingerprint="$(ssh-keygen -yf "$HOME/.ssh/id_ed25519" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          test "$private_fingerprint" = 'SHA256:x6L1N7kD+rcrlqD7EB+boZgwDQc4AtO6NMMltEHZhpw'

          known_line="$(ssh-keygen -F '100.64.245.55' -f "$HOME/.ssh/known_hosts" | grep -v '^#' | head -n 1)"
          test -n "$known_line"
          known_fingerprint="$(printf '%s\n' "$known_line" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          test "$known_fingerprint" = 'SHA256:iy4hCZtEYlqi3MjSxLFmX7cKPTFXXfecZultd7c2Xj4'

          printf 'DEPLOY_PRIVATE_KEY_IDENTITY=GREEN_EXPECTED_ED25519_FINGERPRINT\n'
          printf 'TARGET_KNOWN_HOSTS=GREEN_EXACT_OOB_ED25519_FINGERPRINT\n'

      - name: Verify private route and authenticate restricted deploy identity read-only
        shell: bash
        run: |
          set -euo pipefail
          target='100.64.245.55'
          user='straleon-deploy'

          own_ip="$(tailscale ip -4)"
          case "$own_ip" in
            100.*) ;;
            *) exit 1 ;;
          esac

          route_line="$(ip route get "$target")"
          case "$route_line" in
            *"dev tailscale0"*) ;;
            *) exit 1 ;;
          esac

          remote_output="$(ssh \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/id_ed25519" \
            "$user@$target" \
            'set -eu
             root=/srv/srcm
             releases="$root/releases"
             current="$root/current"
             shared="$root/shared"
             db="$shared/database/database.sqlite"
             test "$(id -un)" = "straleon-deploy"
             test "$(hostname)" = "straleon-prod-01"
             test -d "$root"
             test -d "$releases"
             test -d "$shared"
             test -f "$shared/.env"
             test -d "$shared/storage"
             test -f "$db"
             test ! -e "$current"
             test ! -L "$current"
             test -z "$(find "$releases" -mindepth 1 -maxdepth 1 -print -quit)"
             db_sha="$(sha256sum "$db" | cut -d " " -f 1)"
             db_size="$(stat -c %s "$db")"
             test "$db_sha" = "b07434ffcaaea6c1be8373b2187e725dceb70be40bfbdc3571af5df5ba85595e"
             test "$db_size" = "3694592"
             printf "REMOTE_DEPLOY_IDENTITY=GREEN_STRICT_READ_ONLY_AUTH\\n"
             printf "REMOTE_HOSTNAME=GREEN_STRALEON_PROD_01\\n"
             printf "REMOTE_PREPARED_INFRASTRUCTURE=GREEN_ROOT_SHARED_RELEASES\\n"
             printf "REMOTE_RELEASES=GREEN_EMPTY\\n"
             printf "REMOTE_CURRENT=GREEN_ABSENT\\n"
             printf "REMOTE_DATABASE_SHA256=GREEN_EXACT_INITIAL_SNAPSHOT\\n"
             printf "REMOTE_DATABASE_SIZE=GREEN_EXACT_INITIAL_SNAPSHOT\\n"
             printf "REMOTE_MUTATION=NO\\n"')"

          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_DEPLOY_IDENTITY=GREEN_STRICT_READ_ONLY_AUTH'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_HOSTNAME=GREEN_STRALEON_PROD_01'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_PREPARED_INFRASTRUCTURE=GREEN_ROOT_SHARED_RELEASES'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_RELEASES=GREEN_EMPTY'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_CURRENT=GREEN_ABSENT'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_DATABASE_SHA256=GREEN_EXACT_INITIAL_SNAPSHOT'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_DATABASE_SIZE=GREEN_EXACT_INITIAL_SNAPSHOT'
          printf '%s\n' "$remote_output" | grep -qx 'REMOTE_MUTATION=NO'

          printf 'TAILSCALE_PRIVATE_PATH=GREEN_TAILSCALE0\n'
          printf 'PRIVATE_SSH_AUTH=GREEN_STRICT_HOSTKEY_PUBLICKEY_ONLY\n'
          printf 'DEPLOY_USER=GREEN_STRALEON_DEPLOY\n'
          printf 'TARGET_PUBLIC_IPV4_USED=NO\n'
          printf 'REMOTE_MUTATION_INTENDED=NO\n'
          printf 'APPLICATION_DEPLOYMENT=NO\n'

      - name: Remove SSH material from ephemeral runner
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
