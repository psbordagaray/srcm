name: SRCM CI

on:
  push:
    branches:
      - feature/core-entity
  pull_request:
    branches:
      - feature/core-entity

permissions:
  contents: read

concurrency:
  group: srcm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup deterministic PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:2.10.2

      - name: Runtime versions
        shell: bash
        run: |
          set -euo pipefail
          php -v
          composer --version
          node --version
          npm --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "Unexpected PHP family: ".PHP_VERSION.PHP_EOL); exit(1); }'
          php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Xdebug must not be loaded in CI".PHP_EOL); exit(1); }'
          node - <<'NODE'
          const [major, minor] = process.versions.node.split('.').map(Number);
          const supported = major > 22 || (major === 22 && minor >= 12) || (major === 20 && minor >= 19);
          if (!supported) {
            throw new Error(`Node ${process.versions.node} is below the Vite 8 runtime floor`);
          }
          NODE

      - name: Validate locked dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f composer.lock
          test -f package-lock.json
          composer validate --strict --no-check-publish

      - name: Install PHP dependencies from composer.lock
        shell: bash
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies from package-lock.json
        shell: bash
        run: npm ci --ignore-scripts

      - name: Prepare ephemeral application key
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force

      - name: Diff whitespace gate
        shell: bash
        run: git diff --check

      - name: Release preflight contract
        shell: bash
        run: php artisan srcm:release-preflight --ci

      - name: Production asset build
        shell: bash
        run: npm run build

      - name: Verify Vite manifest
        shell: bash
        run: test -f public/build/manifest.json

      - name: Full test suite
        shell: bash
        run: composer test

      - name: Tracked tree must remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
