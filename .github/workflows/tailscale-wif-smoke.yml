name: SRCM Tailscale WIF Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/core-entity
    paths:
      - .github/workflows/tailscale-wif-smoke.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: srcm-tailscale-wif-smoke
  cancel-in-progress: false

jobs:
  tailscale-wif-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Connect ephemeral Tailscale node via WIF
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:straleon-ci-deploy

      - name: Verify WIF session only
        shell: bash
        run: |
          set -euo pipefail
          command -v tailscale >/dev/null
          tailscale status --json >/dev/null
          ts_ip="$(tailscale ip -4)"
          test -n "$ts_ip"
          case "$ts_ip" in
            100.*) ;;
            *) exit 1 ;;
          esac
          printf 'TAILSCALE_WIF_SMOKE=GREEN\n'
          printf 'TAILSCALE_EPHEMERAL_NODE=ONLINE\n'
          printf 'TARGET_SERVER_CONTACT_ATTEMPTED=NO\n'
